name: Validate THERMABOT static web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            drive-connect.js
            functions/google-connection-store.js
            functions/api/google-auth.js
            functions/api/drive-connection.js
            suite.js
            suite-core.js
            daily-actions-core.js
            workday-core.js
            project-drive-core.js
            automation-core.js
            automations.js
            functions/api/drive-automation.js
            functions/api/capture-upload.js
            document-index-core.js
            drive-documents.js
            functions/api/document-index.js
            suite.css
            workspace.html
            workspace.css
            workspace.js
            workspace-core.js
            index.html
            styles.css
            app-v023.js
            realtime-input.js
            engine.js
            pressure.html
            pressure.css
            pressure-network.js
            pressure-app.js
            tracker.html
            tracker.css
            tracker.js
            tracker-drive-autosync.js
            sw.js
            manifest.webmanifest
            version.json
            report-core.js
            report-docx.js
            reports.js
            reports/template-hvac.docx
            vendor/jszip.min.js
            icon-192.png
            icon-512.png
            functions/_middleware.js
            functions/api/tracker-sync.js
            functions/api/ai-chat.js
            thermabot-ai.js
            .nojekyll
          )
          for f in "${required[@]}"; do
            test -e "$f" || { echo "Missing required file: $f"; exit 1; }
          done

      - name: JavaScript syntax checks
        run: |
          node --check app-v023.js
          node --check realtime-input.js
          node --check engine.js
          node --check pressure-network.js
          node --check pressure-app.js
          node --check tracker.js
          node --check tracker-drive-autosync.js
          node --check sw.js
          node --check thermabot-ai.js
          node --check workspace.js
          node --check workspace-core.js
          node --check cloud-sync.js
          node --check drive-connect.js
          node --input-type=module --check < functions/api/google-auth.js
          node --input-type=module --check < functions/api/drive-connection.js
          node --input-type=module --check < functions/google-connection-store.js
          node --test tests/google-connection.test.mjs
          node --check suite.js
          node --check suite-core.js
          node --check document-index-core.js
          node --check drive-documents.js
          node --check engineering-core.js
          node --check project-flow-core.js
          node --check project-flow.js
          node --check report-core.js
          node --check report-docx.js
          node --check reports.js
          node --test tests/ai-chat.test.cjs
          node --test --test-isolation=none tests/engineering.cjs tests/project-flow.cjs tests/reports.cjs
          node tests/cloud-status.cjs
          node tests/tracker-reliability.cjs
          node tests/workspace.cjs
          node tests/suite.cjs
          node --test --test-isolation=none tests/workspace-sync.test.mjs
          node --test tests/google-auth.test.mjs tests/automation-core.cjs tests/drive-automation.test.mjs tests/project-drive.cjs tests/workday.cjs tests/capture-upload.test.mjs tests/daily-actions.cjs tests/daily-work.cjs tests/document-index.cjs tests/document-index.test.mjs tests/drive-documents.cjs
          cd quadri && node --test --test-isolation=none tests/*.test.ts && cd ..
          node --input-type=module --check < functions/_middleware.js
          node --input-type=module --check < functions/api/tracker-sync.js
          node --input-type=module --check < functions/api/ai-chat.js
          node --input-type=module --check < functions/api/workspace-sync.js
          node --input-type=module --check < functions/api/document-index.js
          node --input-type=module --check < functions/api/capture-upload.js
          node --check automation-core.js
          node --check automations.js
          node --input-type=module --check < functions/api/drive-automation.js
          node --input-type=module --check < workers/automation-scheduler.js
          node --check project-drive-core.js
          node --check workday-core.js
          node --check daily-actions-core.js

      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); JSON.parse(require('fs').readFileSync('version.json','utf8')); console.log('JSON OK')"

      - name: Validate static references
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'app-v023.js' index.html
          grep -q 'realtime-input.js' index.html
          grep -q 'styles.css' index.html
          grep -q 'manifest.webmanifest' index.html
          # Presurización was retired: its old URL must redirect to Inicio.
          grep -q 'tracker.html?view=dashboard' pressure.html
          grep -q 'project-flow-core.js' tracker.html
          grep -q 'project-flow.js' tracker.html
          grep -q 'management.css' tracker.html
          grep -q 'tracker.js' tracker.html
          grep -q 'tracker.css' tracker.html
          grep -q 'styles.css' tracker.html
          grep -q 'urn:ietf:params:oauth:grant-type:jwt-bearer' functions/api/tracker-sync.js
          grep -q 'cloud-sync.js' tracker.html
          grep -q 'quadri/index.html' suite.js
          test -s quadri/index.html
          echo 'Static references OK'

      - name: Test workday in desktop and mobile browser
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/thermabot-browser" playwright
          "$RUNNER_TEMP/thermabot-browser/node_modules/.bin/playwright" install --with-deps chromium
          THERMABOT_PLAYWRIGHT="$RUNNER_TEMP/thermabot-browser/node_modules/playwright" node tests/workday-browser.cjs
