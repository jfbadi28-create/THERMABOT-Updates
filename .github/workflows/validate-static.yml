name: Validate THERMABOT static web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            suite.js
            suite-core.js
            suite.css
            workspace.html
            workspace.css
            workspace.js
            workspace-core.js
            index.html
            styles.css
            app-v023.js
            realtime-input.js
            engine.js
            pressure.html
            pressure.css
            pressure-network.js
            pressure-app.js
            tracker.html
            tracker.css
            tracker.js
            tracker-drive-autosync.js
            sw.js
            manifest.webmanifest
            version.json
            icon-192.png
            icon-512.png
            functions/_middleware.js
            functions/api/tracker-sync.js
            .nojekyll
          )
          for f in "${required[@]}"; do
            test -e "$f" || { echo "Missing required file: $f"; exit 1; }
          done

      - name: JavaScript syntax checks
        run: |
          node --check app-v023.js
          node --check realtime-input.js
          node --check engine.js
          node --check pressure-network.js
          node --check pressure-app.js
          node --check tracker.js
          node --check tracker-drive-autosync.js
          node --check sw.js
          node --check workspace.js
          node --check workspace-core.js
          node --check suite.js
          node --check suite-core.js
          node tests/tracker-reliability.cjs
          node tests/workspace.cjs
          node tests/suite.cjs
          node --input-type=module --check < functions/_middleware.js
          node --input-type=module --check < functions/api/tracker-sync.js

      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); JSON.parse(require('fs').readFileSync('version.json','utf8')); console.log('JSON OK')"

      - name: Validate static references
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'app-v023.js' index.html
          grep -q 'realtime-input.js' index.html
          grep -q 'styles.css' index.html
          grep -q 'manifest.webmanifest' index.html
          grep -q 'engine.js' pressure.html
          grep -q 'pressure-network.js' pressure.html
          grep -q 'pressure-app.js' pressure.html
          grep -q 'pressure.css' pressure.html
          grep -q 'tracker.js' tracker.html
          grep -q 'tracker-drive-autosync.js' tracker.html
          grep -q 'tracker.css' tracker.html
          grep -q 'styles.css' tracker.html
          grep -q 'tracker-drive-autosync.js' sw.js
          grep -q '1EhdGZwuo3t8k_Y32tVbYEtUTjjOBbo88eyK7OFXEXBs' tracker-drive-autosync.js
          grep -q '1EhdGZwuo3t8k_Y32tVbYEtUTjjOBbo88eyK7OFXEXBs' functions/api/tracker-sync.js
          grep -q 'urn:ietf:params:oauth:grant-type:jwt-bearer' functions/api/tracker-sync.js
          echo 'Static references OK'
