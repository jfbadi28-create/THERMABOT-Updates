name: Geometry preview build

on:
  push:
    branches:
      - feat/geometry-workbench-20261007

permissions:
  contents: write

jobs:
  build-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/geometry-workbench-20261007
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Quadri
        run: cd quadri && node build.mjs
      - name: Test Quadri engine and geometry
        run: cd quadri && node --test --test-isolation=none tests/*.test.ts
      - name: Commit generated preview
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- quadri/index.html quadri/dist-app.js; then
            echo "Generated files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quadri/index.html quadri/dist-app.js
          git commit -m "Build geometry preview artifacts"
          git push origin HEAD:feat/geometry-workbench-20261007
