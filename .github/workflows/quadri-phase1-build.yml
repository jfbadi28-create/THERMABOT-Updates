name: Build Quadri phase 1 artifacts

on:
  push:
    branches:
      - feature/quadri-audit-phase1

permissions:
  contents: write

jobs:
  build-phase1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/quadri-audit-phase1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test Quadri
        working-directory: quadri
        run: npm test
      - name: Build browser artifacts
        working-directory: quadri
        run: npm run build
      - name: Commit generated browser artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- quadri/index.html quadri/dist-app.js; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quadri/index.html quadri/dist-app.js
          git commit -m "Build Quadri phase 1 browser artifacts"
          git push origin HEAD:feature/quadri-audit-phase1
